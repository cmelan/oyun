    .wakeCard .wakeMeta{grid-column:2;margin:2px 0 0!important;font-size:11px!important;line-height:1.18!important}.wakeCard .wakeFact{grid-column:2;margin:4px 0 2px;padding:5px 7px;border-radius:9px;font-size:11px;line-height:1.2}
    .wakeCard .hint{display:none}.wakeCard .treeWakeAction{grid-column:1 / -1;position:sticky;bottom:-1px;margin:5px -14px 0;padding:7px 14px calc(7px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(255,247,236,.75),#fff7ec 25%);}
    /* 52px leaves a physical 48px target after mobile browser scaling. */
    .wakeCard #tDone{width:min(330px,100%);min-height:52px;font-size:16px;padding:10px 20px}
    .meadowRecap{margin:5px 0 8px;gap:9px}.meadowRecap span{width:32px;height:32px;font-size:18px}
  }
  @media (hover:hover) and (pointer:fine){.pad{display:none!important}}
  button:focus-visible,.sayBtn:focus-visible{outline:3px solid #fff4a8;outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
