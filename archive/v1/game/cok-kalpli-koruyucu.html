<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Çok Kalpli Koruyucu</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{margin:0;height:100%;background:#0f2b29;overflow:hidden;font-family:"Trebuchet MS","Segoe UI","Noto Sans Arabic","Geeza Pro",system-ui,sans-serif;}
  html[dir="rtl"] .card{text-align:right;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;width:100%;height:100%;object-fit:contain;background:#57c0ba;touch-action:none;}
  .top{position:absolute;top:12px;width:42px;height:42px;border:none;border-radius:13px;background:rgba(255,247,236,.85);color:#1f4d4a;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);z-index:7;}
  .top:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15);}
  #restart{right:12px;} #mute{right:60px;} #fsBtn{right:108px;} #pauseBtn{right:156px;}
  .pad{position:absolute;bottom:18px;z-index:5;}
  #padL{left:18px;display:flex;gap:13px;}
  #padR{right:18px;display:grid;grid-template-columns:repeat(2,auto);gap:12px;}
  .btn{width:70px;height:70px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:27px;color:#1f4d4a;background:rgba(255,247,236,.78);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;font-weight:bold;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  #bJump{background:rgba(255,178,122,.9);} #bSand{background:rgba(232,194,122,.92);position:relative;} #bHeal{background:rgba(255,213,74,.92);}
  #sandCount{position:absolute;top:-4px;right:-4px;background:#fff7ec;color:#7a5a1a;font-size:11px;font-weight:bold;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.18);padding:0 2px;}
  #menu{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;z-index:7;}
  .play{border:none;background:#ffb27a;color:#5a2c12;font-weight:bold;font-size:19px;padding:13px 42px;border-radius:18px;cursor:pointer;box-shadow:0 6px 0 #d98a52;}
  .play:active{transform:translateY(3px);box-shadow:0 3px 0 #d98a52;}
  .ghost{border:none;background:rgba(255,247,236,.85);color:#1f4d4a;font-weight:bold;font-size:14px;padding:9px 22px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.13);}
  .ghost:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.13);}
  .lock{opacity:.5;pointer-events:none;}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center;}
  #ov{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(15,43,41,.55);backdrop-filter:blur(3px);text-align:center;padding:18px;}
  #ov.hidden{display:none;}
  .card{background:#fff7ec;border-radius:26px;padding:22px 24px 18px;max-width:480px;box-shadow:0 12px 0 rgba(0,0,0,.18);}
  .card h1{margin:0 0 6px;color:#1f4d4a;font-size:23px;line-height:1.15;}
  .card p{margin:6px 0 14px;color:#37635f;font-size:14px;line-height:1.5;}
  .card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .eyes{font-size:28px;letter-spacing:3px;margin-bottom:6px;}
  .hint{font-size:11.5px;color:#7a9a96;margin-top:10px;line-height:1.5;}
  .pw{display:inline-block;padding:1px 6px;border-radius:7px;color:#fff;font-weight:bold;font-size:12px;}
  #langRow{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:7;}
  .langBtn{border:none;background:rgba(255,247,236,.78);color:#1f4d4a;font-weight:bold;font-size:12px;padding:7px 10px;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .langBtn.active{background:#ffb27a;color:#5a2c12;}
  .mapRegion{margin:12px 0;text-align:left;}
  .mapRegion h2{margin:0 0 4px;color:#1f4d4a;font-size:15px;}
  .mapPath{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
  .mapNode{width:38px;height:38px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);flex:none;}
  .mapNode.locked{background:#bfc9c6;color:#7a8683;cursor:default;box-shadow:none;}
  .mapNode.done{background:#5fc77f;}
  .mapNode.next{background:#ffb27a;color:#5a2c12;}
  .mapLine{width:16px;height:4px;background:#d8cdbf;flex:none;}
  .mapLine.done{background:#5fc77f;}
  .mapIcon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;margin-right:6px;vertical-align:middle;}
  .clueBadge{width:128px;height:128px;border-radius:50%;margin:2px auto 16px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 38% 32%,#ffffff,#eafaf0 55%,#cdeedd);box-shadow:inset 0 0 0 4px rgba(95,199,127,.35),0 6px 14px rgba(31,77,74,.18);}
  .clueBadge img{width:88px;height:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
  .treeChoices{display:flex;gap:12px;justify-content:center;margin-top:4px;}
  .treeChoice{width:118px;border:none;border-radius:18px;padding:12px 8px 10px;cursor:pointer;background:linear-gradient(#ffffff,#f3ead9);box-shadow:0 5px 0 rgba(31,77,74,.16);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s;}
  .treeChoice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(31,77,74,.16);}
  .treeChoice img{width:58px;height:auto;}
  .treeChoice .tName{font-weight:bold;font-size:16px;color:#1f4d4a;}
  .treeChoice .tDesc{font-size:11px;color:#7a9a96;line-height:1.25;}
  .treeChoice.dim{opacity:.45;filter:grayscale(.6);}
  .wakeCard .tBig{font-size:30px;color:#1f4d4a;margin:2px 0 2px;}
  .wakeFact{background:#eafaf0;border-radius:14px;padding:10px 14px;font-size:13px;color:#37635f;margin:10px 0 4px;line-height:1.45;}
  .sayBtn{border:none;background:#ffd54a;color:#5a4400;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18);flex:none;display:inline-flex;align-items:center;justify-content:center;}
  .sayBtn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .nameRow{display:flex;align-items:center;gap:8px;justify-content:center;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="langRow"><button class="langBtn" data-l="tr">TR</button><button class="langBtn" data-l="en">EN</button><button class="langBtn" data-l="de">DE</button><button class="langBtn" data-l="ar">AR</button></div>
  <button id="pauseBtn" class="top" title="Mola">⏸</button>
  <button id="fsBtn" class="top" title="Tam ekran">⛶</button>
  <button id="mute" class="top" title="Ses">🔊</button>
  <button id="restart" class="top" title="Yeniden başla">↻</button>
  <div class="pad" id="padL"><button class="btn" id="bLeft" aria-label="Sol">◀</button><button class="btn" id="bRight" aria-label="Sağ">▶</button></div>
  <div class="pad" id="padR">
    <button class="btn" id="bSand" aria-label="Kum at">🏖️<span id="sandCount">0</span></button><button class="btn" id="bHeal" aria-label="Sevgi ışığı">💛</button>
    <button class="btn" id="bPow" aria-label="Gücü kullan">✨</button><button class="btn" id="bJump" aria-label="Zıpla">⤴</button>
  </div>
  <div id="menu">
    <button class="play" id="startBtn">▶ Yeni Oyun</button>
    <button class="ghost" id="continueBtn">Devam Et</button>
    <button class="ghost" id="levelsBtn">Bölümler</button>
    <button class="ghost" id="journalBtn">Doğa Günlüğü</button>
    <button class="ghost" id="howBtn">Nasıl Oynanır?</button>
  </div>
  <div id="ov" class="hidden"><div class="card" id="card"></div></div>
</div>
<script>
"use strict";
/* =====================================================================
   ÇOK KALPLİ KORUYUCU — v2 (Aşama 2: Bölüm 2+3, WORLD/bölge şeması,
   yeniden kullanılabilir boss şablonu, harita ekranı, dil altyapısı)
   Bölümler: 1 CONFIG · 2 ENGINE · 3 ENTITIES · 4 SYSTEMS · 5 LEVELS
             6 RENDER · 7 UI · 8 BOOT
   Tüm ayar değerleri v1'den AYNEN taşındı — oyun hissi korunur.
   ===================================================================== */

/* ============================ 1) CONFIG ============================ */

  physics:{GRAV:2000,MOVE:275,ACCEL:2800,FRICTION:2600,JUMP_V:720,JUMP_CUT:260,MAX_FALL:1150,BOUNCE:1000,COYOTE:.10,JBUF:.13},

  sand:{SPD:440,vy0:-150,grav:1400,life:1.1,buffer:2,bossBonus:3},
  monster:{chase:130,aggro:240,patrol:55,happy:35,flipMin:1.4,flipRand:.8},
  juice:{squashK:210,squashDamp:13,trailVy:440,trailChance:.55},
  camera:{lerp:6},

     kimliği yalnız L.boss verisindeki hp/cageEye/finisher/konum belirler. */

    telegraph:.55, shotVx:260, shotVy:-330, shotGrav:1300, shotRadius:13,
    cageT0:1.1, shrinkFactor:.62, defeatT:2.6, paceSpd:40, meleeRange:74, meleeVRange:82 },
  /* Bilge Ağaçlar (Aşama 4 v1): isimlendirerek iyileştirme — canavar döngüsüyle
     aynı duygusal fiil. Tek katman (yaprak ipucu); bark/silüet ustalık katmanları
     ve kalan 9 ağaç, bu tek-ağaç playtest'inden sonraki adım. */

};
const W=CONFIG.canvas.W, H=CONFIG.canvas.H;
const {GRAV,MOVE,ACCEL,FRICTION,JUMP_V,JUMP_CUT,MAX_FALL,BOUNCE,COYOTE,JBUF}=CONFIG.physics;

const {BLIND_TIME,HEAL_TIME}=CONFIG.heal;
const SAND_SPD=CONFIG.sand.SPD;

const TOOLS={ blue:{col:'#3fa9f5',emoji:'❄️'}, red:{col:'#ff6b4a',emoji:'🔥'}, green:{col:'#54c97a',emoji:'🌿'}, yellow:{col:'#ffcc3a',emoji:'🌀'}, purple:{col:'#b07ad8',emoji:'🟣'} };
const tool=k=>TOOLS[k];

/* Dil altyapısı: tüm arayüz metni anahtar üzerinden çekilir. Şimdilik yalnız
   tr doludur — en/de/ar için çeviri Aşama 2'nin ayrı bir alt adımıdır (kalite
   için gözden geçirilmeden yayınlanmaz). Bölüm-içi ipucu tabelaları ve bölüm
   adları henüz anahtarlanmadı; bu da aynı çeviri adımında yapılacak. */
const STR={
  tr:{
    'ui.newGame':'▶ Yeni Oyun','ui.continue':'Devam Et','ui.levels':'Bölümler','ui.howto':'Nasıl Oynanır?',

    'next.eyes':'🌟👁️💚👁️🌟','next.suffix':' tamamlandı!','next.body':'Harikasın, Koruyucu! Yeni bir dünya seni bekliyor.',
    'win.eyes':'🏆👁️💚👁️🏆','win.title':'Tebrikler! Macera tamam!',
    'win.body':'Üç dünyayı da dövüşmeden, sadece sevgi ve zekânla dengeye kavuşturdun. Gerçek bir Çok Kalpli Koruyucu!',

    'region.cayir':'Çayır Vadisi','region.zirveler':'Zümrüt Zirveler','region.magara':'Kristal Mağaralar','region.kestane':'Kestane Korusu',
    'ui.journal':'Doğa Günlüğü',
    'tree.prompt':'✨ Uyuyan Bilge Ağaç — dokun!','tree.question':'Bu yaprak hangi ağacın?',
    'tree.wake.eyes':'🌳✨','tree.wake.title':' uyandı!','tree.wake.body':'Doğa Günlüğü\'ne eklendi ✓',
    'journal.title':'Doğa Günlüğü','journal.empty':'Henüz uyandırdığın bir ağaç yok. Bölümlerde parıldayan uyuyan ağaçları ara!',

  },
  en:{}, de:{}, ar:{}, /* aşama 2 çeviri alt-adımı: doldurulacak, tr'ye düşer (fallback) */

let lang=null; /* boot'ta save.lang'dan atanır */
function S(key){ const t=lang&&STR[lang]; if(t&&t[key]!==undefined) return t[key]; return STR.tr[key]!==undefined?STR.tr[key]:key; }

/* Biyom paletleri + bölge kayıt defteri (WORLD, bölüm 5'te). Her biyom kendi
   3-katman paralaks arka planını, platform stilini ve ortam parçacığını taşır —
   yeni bölge = yeni palet + veri, motor değişmez. */
const BIOME={
  meadow:{
    skyTop:'#daf4e4', skyMid:'#8fdcca', skyBot:'#55c0ba',
    cloudFar:'rgba(255,255,255,.5)', cloudNear:'rgba(255,255,255,.66)',
    hillsFar:'#abe0d0', hillsMid:'#7ccfad', bushes:'#5abd8c',
    soil:'#9a6b43', soilDark:'#85593a', grass:'#5fc77f', grassLight:'#74d692',

  },
  peaks:{
    skyTop:'#dff6f0', skyMid:'#a9e6dc', skyBot:'#4fb3ad',
    cloudFar:'rgba(255,255,255,.55)', cloudNear:'rgba(255,255,255,.7)',
    hillsFar:'#bfe9e2', hillsMid:'#8fd0c6', bushes:'#3f8c7e',
    soil:'#6b7a78', soilDark:'#57645f', grass:'#eef7f5', grassLight:'#ffffff',
    treeTrunk:'#4a3a2e', treeLeafA:'#2f6b52', treeLeafB:'#245a44',
    ambientA:'#eaf7ff', ambientB:'#cfeeff', ambientShape:'wisp',
  },
  cave:{
    skyTop:'#241d3a', skyMid:'#1c1733', skyBot:'#0e0b1e',
    cloudFar:'rgba(111,208,255,.4)', cloudNear:'rgba(181,140,240,.4)',
    hillsFar:'#2a2242', hillsMid:'#201936', bushes:'#160f2a',
    soil:'#3c365a', soilDark:'#2a2440', grass:'#4a4470', grassLight:'#5d5688',
    crystalA:'#6fd0ff', crystalB:'#b58cf0',
    ambientA:'#8fd8ff', ambientB:'#cbb0f5', ambientShape:'mote',
  },
  forest:{
    skyTop:'#fbe8c8', skyMid:'#f0c68a', skyBot:'#d99a5c',

    hillsFar:'#e0a866', hillsMid:'#c9863f', bushes:'#a5672e',
    soil:'#6b4a30', soilDark:'#573a25', grass:'#b5772f', grassLight:'#d99a4a',
    treeTrunk:'#5a3f28', treeLeafA:'#d9863f', treeLeafB:'#b5622a',
    ambientA:'#e8b25a', ambientB:'#c96b3a', ambientShape:'leaf',

};

/* Bilge Ağaçlar içerik kaydı. AD dört dilde (sözlük düzeyi, güvenli); açıklama/
   aile/fun-fact şimdilik TR — tam çeviri geçişinde dolacak.
   GERÇEK FOTOĞRAF YUVASI: her ağaca isteğe bağlı `photo` alanı eklenebilir
   (base64 data-URL). Varsa arayüz fotoğrafı kullanır, yoksa botanik-doğru
   vektör çizime düşer. Web'den fotoğraf GÖMÜLMEDİ — ticari (Apple Arcade)
   hedefte lisans riski + tek-dosya/çevrimdışı kısıtında boyut patlaması;
   kendi çektiğin/lisansladığın fotoğrafları buraya koy. */
const TREES={

    fact:'Kabuğu kağıt gibi ince tabakalar halinde soyulur.', crown:'oval' },
  'akçaağaç':{ name:{tr:'Akçaağaç',en:'Maple',de:'Ahorn',ar:'قيقب'}, family:'Sabunağacıgiller', desc:'Yıldız yapraklı ağaç', gift:'Sonbaharda kızıl yapraklarıyla ormanı renklendirir',

    fact:'Dalları su kenarına doğru zarif bir şekilde sarkar.', crown:'weeping' },
  'ginkgo':{ name:{tr:'Ginkgo',en:'Ginkgo',de:'Ginkgo',ar:'جنكة'}, family:'Ginkgogiller', desc:'Yelpaze yapraklı ağaç', gift:'Dünyanın en yaşlı ağaç türlerinden biridir',
    fact:'Dinozorların zamanından beri hiç değişmemiş bir ağaç türü!', crown:'oval' },

const MONSTER_TYPES={ walker:{flip:false}, flipper:{flip:true} };
function makeMonster(d){ const T=MONSTER_TYPES[d.type||'walker']||MONSTER_TYPES.walker;
  return Object.assign({w:40,h:40,state:'angry',vx:0,dir:-1,face:-1,blindT:0,healT:0,flipT:0,
    spd:CONFIG.monster.chase,aggro:CONFIG.monster.aggro,patrolSpd:CONFIG.monster.patrol,flip:T.flip},d); }
const mbox=m=>({x:m.x,y:m.ground-m.h,w:m.w,h:m.h});

function healed(m){ m.state='happy'; m.healT=0; m.vx=0; sfx('heal'); hitStop(.07); screenShake(2,.12); gainHeart(); spawnP(m.x+m.w/2,m.ground-m.h,26,'#ffe6a0',200,1); }

function updateMonster(m,dt,pcx,pFeet){
  if(m===healTarget){ m.healT+=dt; if(m.healT>=HEAL_TIME) healed(m); }
  else m.healT=Math.max(0,m.healT-dt*CONFIG.heal.decay);
  if(m.state==='happy'){ if(m.x<=m.gx0)m.dir=1; if(m.x>=m.gx1)m.dir=-1; m.vx=m.dir*CONFIG.monster.happy; m.face=m.dir; m.x+=m.vx*dt; return; }
  if(m.state==='blind'){ m.blindT-=dt; m.vx=0; if(m.blindT<=0)m.state='angry'; return; }
  if(m.flip){ m.flipT-=dt; if(m.flipT<=0){ m.dir*=-1; m.flipT=CONFIG.monster.flipMin+Math.random()*CONFIG.monster.flipRand; } }
  const d=pcx-(m.x+m.w/2);
  if(Math.abs(d)<m.aggro&&Math.abs(pFeet-m.ground)<70){ m.vx=Math.sign(d)*m.spd; m.face=Math.sign(d)||m.face; }
  else { if(m.x<=m.gx0)m.dir=1; if(m.x>=m.gx1)m.dir=-1; m.vx=m.dir*m.patrolSpd; m.face=m.dir; }
  m.x+=m.vx*dt; m.x=Math.max(m.lo,Math.min(m.hi-m.w,m.x));
  if(player.iframe<=0&&overlap(player,mbox(m))) loseLife(false);
}

/* --- 4b Ses (Web Audio sentezi) — v1 ile birebir --- */
let audio=null,masterGain=null,muted=!!save.muted;
function initAudio(){ if(audio) return; try{ audio=new (window.AudioContext||window.webkitAudioContext)(); masterGain=audio.createGain(); masterGain.gain.value=muted?0:.5; masterGain.connect(audio.destination); audio.resume&&audio.resume(); }catch(e){ audio=null; } }
function beep(f,dur,type,vol,slideTo){ if(!audio||muted) return; const t0=audio.currentTime; const o=audio.createOscillator(),g=audio.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur); g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(vol||.3,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0+dur+.03); }
function noise(dur,vol,cut){ if(!audio||muted) return; const t0=audio.currentTime; const b=audio.createBuffer(1,Math.floor(audio.sampleRate*dur),audio.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const src=audio.createBufferSource(); src.buffer=b; const f=audio.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; const g=audio.createGain(); g.gain.setValueAtTime(vol||.2,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); src.connect(f); f.connect(g); g.connect(masterGain); src.start(t0); }
function seq(a,dur,gap,type,vol){ a.forEach((f,i)=>setTimeout(()=>beep(f,dur,type,vol,0), i*gap)); }
function sfx(n){ if(!audio||muted) return; switch(n){
  case 'jump': beep(300,.12,'sine',.25,560); break; case 'freeze': beep(950,.28,'sine',.25,420); break;
  case 'burn': noise(.25,.22,600); beep(160,.2,'sawtooth',.1,90); break; case 'grow': beep(280,.3,'sine',.22,680); break;
  case 'cut': noise(.14,.22,3200); beep(820,.12,'sawtooth',.1,260); break; case 'sand': noise(.12,.2,1600); break;
  case 'shrink': beep(720,.26,'sine',.24,170); break; case 'boing': beep(280,.18,'sine',.3,760); break;
  case 'puff': noise(.16,.18,900); break; case 'ding': beep(880,.14,'sine',.28,0); beep(1320,.18,'sine',.2,0); break;
  case 'heal': seq([523,659,784],.3,90,'sine',.22); break; case 'thud': beep(120,.18,'triangle',.3,70); noise(.12,.16,500); break;
  case 'cage': seq([330,494,659],.28,70,'sine',.2); break; case 'bosshurt': beep(300,.25,'square',.18,140); break;
  case 'hurt': beep(400,.2,'sine',.24,200); break; case 'clear': seq([523,659,784,1047],.3,110,'sine',.24); break;
  case 'win': seq([523,659,784,1047,1319],.34,120,'sine',.26); break; case 'sad': seq([440,392,330,262],.3,150,'sine',.2); break;
  case 'wake': seq([392,523,659,880],.28,90,'sine',.24); break; } }
const MEL=[523.25,587.33,659.25,783.99,659.25,587.33,659.25,880,783.99,659.25,587.33,523.25]; let mi=0;
function musicTick(){ if(!audio||muted) return; if(state!=='play'&&state!=='menu') return; const t0=audio.currentTime; const o=audio.createOscillator(),g=audio.createGain(); o.type='sine'; o.frequency.value=MEL[mi%MEL.length]/2; g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(.05,t0+.05); g.gain.exponentialRampToValueAtTime(.0001,t0+.55); o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0+.6); if(mi%4===0){ const ob=audio.createOscillator(),gb=audio.createGain(); ob.type='triangle'; ob.frequency.value=130.81; gb.gain.setValueAtTime(.045,t0); gb.gain.exponentialRampToValueAtTime(.0001,t0+.85); ob.connect(gb); gb.connect(masterGain); ob.start(t0); ob.stop(t0+.9); } mi++; }
setInterval(musicTick,360);
function toggleMute(){ muted=!muted; save.muted=muted; writeSave(); document.getElementById('mute').textContent=muted?'🔇':'🔊'; if(audio&&masterGain) masterGain.gain.setTargetAtTime(muted?0:.5,audio.currentTime,.02); }

/* --- 4d Ortam parçacıkları (görsel yükseltme, biyoma göre): çayırda süzülen
   yapraklar, zirvelerde ince sis pusları, mağarada kristal tozu. Motor tek —

const ambient=[];

function makeAmbientP(x,y){ const B=BIOME[ambientBiome()]; const shape=B.ambientShape;
  const base={x,y,ph:Math.random()*7,rot:Math.random()*7,c:Math.random()<.7?B.ambientA:B.ambientB};
  if(shape==='wisp') return Object.assign(base,{vx:-(6+Math.random()*10),vy:2+Math.random()*4,sw:.5+Math.random()*.6,vr:0,s:10+Math.random()*14});
  if(shape==='mote') return Object.assign(base,{vx:-(4+Math.random()*6),vy:-(2+Math.random()*6),sw:1.5+Math.random()*1.5,vr:(Math.random()*2-1)*.6,s:1.5+Math.random()*2});
  return Object.assign(base,{vx:-(10+Math.random()*18),vy:10+Math.random()*14,sw:1+Math.random()*1.4,vr:(Math.random()*2-1)*1.6,s:3+Math.random()*3});
}
function resetAmbient(camX){ ambient.length=0; for(let i=0;i<14;i++) ambient.push(makeAmbientP(camX+Math.random()*W,Math.random()*H*.8)); }
function updateAmbient(dt,camX){ for(let i=0;i<ambient.length;i++){ const l=ambient[i]; l.x+=(l.vx+Math.sin(t*l.sw+l.ph)*10)*dt; l.y+=l.vy*dt; l.rot+=l.vr*dt;
  if(l.y>H+30||l.y<-40||l.x<camX-80) ambient[i]=makeAmbientP(camX+40+Math.random()*W, BIOME[ambientBiome()].ambientShape==='mote'?H+10:-20); } }

const sands=[]; let sandLeft=0, sandMax=0;

  if(sandLeft<=0){ hintMsg='Kum bitti! Bir sonraki kontrol noktasında dolar'; hintT=1.8; return; }
  sandLeft--; updateSandBadge(); sfx('sand');
  sands.push({x:player.x+player.w/2+player.face*12,y:player.y+12,vx:player.face*SAND_SPD,vy:CONFIG.sand.vy0,life:CONFIG.sand.life});
  spawnP(player.x+player.w/2+player.face*12,player.y+12,6,'#e8c27a',120,.3); }

  for(const m of L.monsters){ if(m.state==='happy')continue; const b=mbox(m); if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){ m.state='blind'; m.blindT=BLIND_TIME; m.healT=0; sfx('puff'); hitStop(.05); screenShake(2,.1); spawnP(s.x,s.y,16,'#e8c27a',180,.6); hit=true; break; } }
  if(!hit&&L.boss&&bossActive&&L.boss.state==='idle'){ const b=bossBox(); if(s.x>b.x&&s.x<b.x+b.w&&s.y>b.y&&s.y<b.y+b.h){

  if(hit||s.life<=0||s.y>L.deathY) sands.splice(i,1); } }

        ctx.beginPath(); ctx.moveTo(x+b.w/2,b.y+20); ctx.lineTo(x+b.w/2+7,b.y+36); ctx.lineTo(x+b.w/2,b.y+52); ctx.lineTo(x+b.w/2-7,b.y+36); ctx.fill();
        drawEyeMark(it.em,'purple'); } else { ctx.fillStyle='#6b6480'; ctx.beginPath(); ctx.arc(x+b.w/2,b.y+b.h-6,7,0,7); ctx.fill(); } } },
  mush:{
    solids:it=> it.done?[it.pad]:[],
    fx(it){ sfx('grow'); spawnP(it.pad.x+it.pad.w/2,it.pad.y,18,'#7fe0a0',160,.8); },
    draw(it){ if(!it.done){ const x=it.sprout.x-cam,y=it.sprout.y; ctx.fillStyle='#d8cdbf'; ctx.fillRect(x-3,y-12,6,12);
        ctx.fillStyle='#d86a8a'; ctx.beginPath(); ctx.ellipse(x,y-13,12,8,0,Math.PI,0); ctx.fill();
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-4,y-15,2,0,7); ctx.arc(x+4,y-16,1.6,0,7); ctx.fill(); drawEyeMark(it.em,'purple'); }
      else { const p=it.pad,x=p.x-cam, bob=Math.sin(t*6)*2; ctx.fillStyle='#d8cdbf'; ctx.fillRect(x+p.w/2-7,p.y+8,14,20);
        ctx.fillStyle='#e0738f'; ctx.beginPath(); ctx.ellipse(x+p.w/2,p.y+8+bob,p.w/2,16,0,Math.PI,0); ctx.fill();
        ctx.fillStyle='#fff'; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(x+18+i*22,p.y-1+bob,3,0,7); ctx.fill(); } } } },
  torch:{
    solids:()=>[],
    fx(it){ sfx('burn'); spawnP(it.x,it.y-30,18,'#ffcf7a',150,.8); },
    draw(it){ const x=it.x-cam,y=it.y; ctx.strokeStyle='#7a5a33'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-34); ctx.stroke();
      if(it.done){ const fy=y-42+Math.sin(t*10)*2; ctx.fillStyle='#ffd24a'; ctx.beginPath(); ctx.moveTo(x,fy-15); ctx.quadraticCurveTo(x+9,fy,x,fy+8); ctx.quadraticCurveTo(x-9,fy,x,fy-15); ctx.fill();
        ctx.fillStyle='#ff8a3a'; ctx.beginPath(); ctx.moveTo(x,fy-7); ctx.quadraticCurveTo(x+5,fy+1,x,fy+6); ctx.quadraticCurveTo(x-5,fy+1,x,fy-7); ctx.fill(); }
      else { ctx.fillStyle='#46405f'; ctx.beginPath(); ctx.arc(x,y-38,5,0,7); ctx.fill(); drawEyeMark(it.em,'red'); } } },
};
function solids(){ const arr=L.platforms.slice(); for(const it of L.interact){ const T=INTERACT_TYPES[it.type]; if(T&&T.solids) arr.push(...T.solids(it)); }
  if(L.arena&&bossActive&&L.boss.state!=='defeated') arr.push(L.arena.wall); return arr; }
let equipped=null;
function activate(it){ it.done=true; flashScreen(.18,'190,240,220'); const T=INTERACT_TYPES[it.type]; if(T&&T.fx) T.fx(it); }
function computeEquip(){ const px=player.x+player.w/2, py=player.y+player.h/2;
  for(const it of L.interact){ if(it.done)continue; const z=it.zone; if(px>z.x&&px<z.x+z.w&&py>z.y&&py<z.y+z.h) return it.eye; }
  if(L.boss&&bossActive&&L.boss.state==='blind'&&nearBoss()) return L.boss.cageEye;
  return equipped; }
function doUse(){
  if(L.boss&&bossActive&&L.boss.state==='blind'&&equipped===L.boss.cageEye&&nearBoss()){ startFinish(); return; }
  if(nearTree){ openTreeEncounter(nearTree); return; }
  const px=player.x+player.w/2, py=player.y+player.h/2;
  for(const it of L.interact){ if(it.done)continue; const z=it.zone; if(px>z.x&&px<z.x+z.w&&py>z.y&&py<z.y+z.h&&it.eye===equipped){ activate(it); return; } } }

/* --- 4g2 Boss şablonu: her boss aynı davranışı paylaşır; kimliği yalnız
   L.boss verisi (hp, cageEye, kafes/küçültme, konum) belirler — yeni boss =
   yeni veri girişi. --- */
let bossActive=false;
const bossShots=[];
const bossBox=()=>({x:L.boss.x,y:L.boss.ground-L.boss.h,w:L.boss.w,h:L.boss.h});
const bossAtkInterval=()=>{ const a=CONFIG.boss.atkIntervals; return a[Math.max(0,Math.min(a.length-1,L.boss.hp-1))]; };
const bossFinishEye=()=>tool(L.boss.cageEye).emoji;
const bossFinishVerb=()=>L.boss.finisher==='shrink'?'küçült':'kafesle';
function nearBoss(){ const b=L.boss; return b&&Math.abs((player.x+player.w/2)-(b.x+b.w/2))<b.w/2+CONFIG.boss.meleeRange && Math.abs((player.y+player.h)-b.ground)<CONFIG.boss.meleeVRange; }
function bossThrow(){ const b=L.boss, C=CONFIG.boss, sx=b.x+b.w/2+b.face*34, sy=b.ground-b.h+28, dir=Math.sign((player.x+player.w/2)-sx)||-1;
  bossShots.push({x:sx,y:sy,vx:dir*C.shotVx,vy:C.shotVy}); spawnP(sx,sy,5,'#b9a0c4',120,.3); }
function startFinish(){ const b=L.boss; b.state='caged'; b.cageT=CONFIG.boss.cageT0; b.shake=.4; hitStop(.09); screenShake(5,.18);
  if(b.finisher==='shrink'){ sfx('shrink'); spawnP(b.x+b.w/2,b.ground-b.h/2,24,'#b07ad8',200,.9); }
  else { sfx('cage'); spawnP(b.x+b.w/2,b.ground-b.h/2,28,'#5fc77f',200,.9); } }
function updateBoss(dt,pcx){ if(!L.boss) return; const b=L.boss, C=CONFIG.boss;
  if(!bossActive&&pcx>L.arena.trig){ bossActive=true; b.state='idle'; hintMsg='Önce 🏖️ kum at, sonra '+bossFinishEye()+' ile '+bossFinishVerb()+'!'; hintT=3.5; }
  if(!bossActive) return; if(b.shake>0)b.shake-=dt;
  if(b.state==='idle'){ if(b.x<=b.px0)b.paceDir=1; if(b.x>=b.px1)b.paceDir=-1; b.x+=b.paceDir*C.paceSpd*dt; b.face=(pcx<b.x+b.w/2)?-1:1;
    if(b.tel>0){ b.tel-=dt; if(b.tel<=0) bossThrow(); } else { b.atkT-=dt; if(b.atkT<=0){ b.tel=C.telegraph; b.atkT=bossAtkInterval(); } }
    if(player.iframe<=0&&overlap(player,bossBox())) loseLife(false);
  } else if(b.state==='blind'){ b.blindT-=dt; if(b.blindT<=0) b.state='idle';
  } else if(b.state==='caged'){ b.cageT-=dt; if(b.cageT<=0){ b.hp--;
      if(b.hp<=0){ b.state='defeated'; b.defT=C.defeatT; hitStop(.14); screenShake(6,.24); spawnP(b.x+b.w/2,b.ground-b.h/2,30,'#c2a6ff',200,1.2); }
      else { b.state='idle'; b.atkT=bossAtkInterval()*.85; b.tel=0; sfx('bosshurt');
        if(b.finisher==='shrink'){ b.scale=(b.scale||1)*C.shrinkFactor; spawnP(b.x+b.w/2,b.ground-b.h/2,18,'#b07ad8',160,.8); }
        else spawnP(b.x+b.w/2,b.ground-b.h/2,18,'#5fc77f',160,.8); } }
  } else if(b.state==='defeated'){ b.defT-=dt; if(b.defT<=0) levelComplete(); }
  for(let i=bossShots.length-1;i>=0;i--){ const s=bossShots[i]; s.vy+=C.shotGrav*dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(player.iframe<=0&&overlap(player,{x:s.x-C.shotRadius,y:s.y-C.shotRadius,w:C.shotRadius*2,h:C.shotRadius*2})){ loseLife(false); spawnP(s.x,s.y,10,'#c9b3d6',150,.5); bossShots.splice(i,1); continue; }
    if(s.y>b.ground+10||s.x<L.arena.wall.x-40||s.x>L.w){ spawnP(s.x,Math.min(s.y,b.ground),6,'#b9a0c4',120,.4); bossShots.splice(i,1); } } }

/* --- 4h Bilge Ağaçlar (Aşama 4 v1): "isimlendirerek iyileştirme" — canavar
   döngüsüyle aynı duygusal fiil, ama güç kuşanma yok, yalnız bilmek. Yanlış
   seçim cezasız (tekrar dener); doğru seçim ağacı uyandırır, adını Web Speech
   ile söyler ve Doğa Günlüğü'ne kart ekler. Asla ilerlemeyi kilitlemez. */
let nearTree=null;
function findNearTree(pcx,pFeet){ nearTree=null; if(!L.trees)return; let bd=1e9;
  for(const tr of L.trees){ if(tr.awake)continue; const d=Math.hypot(pcx-tr.x,pFeet-tr.y); if(d<CONFIG.tree.wakeRadius&&d<bd){ bd=d; nearTree=tr; } } }
function pick3(correctId,pool){ const others=pool.filter(id=>id!==correctId);
  for(let i=others.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [others[i],others[j]]=[others[j],others[i]]; }
  const all=[correctId,...others.slice(0,2)];
  for(let i=all.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [all[i],all[j]]=[all[j],all[i]]; }
  return all; }
/* Dil-duyarlı seslendirme: aktif arayüz diline göre konuşur (tr→tr-TR,
   en→en-US, de→de-DE, ar→ar-SA). Ses paketi cihazda yoksa tarayıcı sessizce
   varsayılana düşer — özellik algılama try/catch ile korunuyor. */
const SPEECH_LOCALE={tr:'tr-TR',en:'en-US',de:'de-DE',ar:'ar-SA'};
function speak(text){ try{ if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(text); u.lang=SPEECH_LOCALE[lang]||'tr-TR'; u.rate=.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
/* Bir kart kökündeki tüm 🔊 butonlarını bağlar: dokununca adı okur,
   seçimi TETİKLEMEZ (stopPropagation) — okuma bilmeyenler için. */
function wireSayButtons(root){ root.querySelectorAll('.sayBtn').forEach(sb=>{
  sb.addEventListener('pointerdown',e=>{ e.stopPropagation(); });
  sb.addEventListener('click',e=>{ e.stopPropagation(); e.preventDefault(); speak(sb.dataset.say||''); }); }); }
function openTreeEncounter(treeInst){ state='tree'; clearEdges();
  const region=WORLD[L.regionIdx]||{treeSet:[treeInst.id]};
  const choices=pick3(treeInst.id,region.treeSet);
  card.innerHTML='<h1>'+S('tree.question')+'</h1>'
    +'<div class="clueBadge"><img src="'+getTreeArt(treeInst.id,120,false)+'" alt=""></div>'
    +'<div class="treeChoices" id="treeChoices">'+choices.map(id=>{ const info=TREES[id]||{desc:''};
      return '<button class="treeChoice" data-id="'+id+'"><img src="'+getTreeArt(id,72,true)+'" alt="">'
        +'<span class="nameRow"><span class="tName">'+treeName(id)+'</span><span class="sayBtn" data-say="'+treeName(id)+'" role="button" aria-label="dinle">🔊</span></span>'
        +'<span class="tDesc">'+(info.desc||'')+'</span></button>'; }).join('')+'</div>';
  ov.classList.remove('hidden'); setUI('tree');
  card.querySelectorAll('#treeChoices button').forEach(btn=>{ btn.onclick=()=>{
    if(btn.dataset.id===treeInst.id) wakeTree(treeInst);
    else { screenShake(CONFIG.tree.wrongShake,.15); sfx('puff'); btn.classList.add('dim'); } }; });
  wireSayButtons(card); }
function wakeTree(treeInst){ treeInst.awake=true; sfx('wake');
  const info=TREES[treeInst.id]||{family:'',gift:'',fact:''}, nm=treeName(treeInst.id);
  speak(nm);
  if(!save.journal) save.journal=[]; if(!save.journal.includes(treeInst.id)){ save.journal.push(treeInst.id); writeSave(); }
  spawnP(treeInst.x,treeInst.y-70,26,'#ffe6a0',180,1.1); screenShake(2,.2); hitStop(.06);
  card.innerHTML='<div class="wakeCard"><div class="eyes">'+S('tree.wake.eyes')+'</div>'
    +'<div class="clueBadge"><img src="'+getTreeArt(treeInst.id,120,false)+'" alt=""></div>'
    +'<div class="tBig nameRow"><span><b>'+nm+'</b>'+S('tree.wake.title')+'</span><span class="sayBtn" data-say="'+nm+'" role="button" aria-label="dinle">🔊</span></div>'
    +'<p style="margin:2px 0 0">'+S('journal.family')+info.family+' · '+(info.desc||'')+'</p>'
    +'<div class="wakeFact">🌱 '+(info.fact||info.gift)+'</div>'
    +'<p class="hint">'+S('tree.wake.body')+'</p>'
    +'<div class="row"><button class="play" id="treeDoneBtn">'+S('ui.resume')+'</button></div></div>';
  const b=document.getElementById('treeDoneBtn'); if(b) b.onclick=resumeGame;
  wireSayButtons(card); }

/* --- 4i Canlar, kontrol noktaları, bölüm sonu --- */
let hearts=CONFIG.hearts, respawn={x:90,y:340};
function softRespawn(){ player.x=respawn.x; player.y=respawn.y; player.vx=0; player.vy=0; player.iframe=.6; player.squashVel=0; }
function loseLife(doRespawn){ if(player.iframe>0&&!doRespawn) return; hearts--; flashScreen(.45,'255,80,90'); sfx('hurt'); screenShake(3,.15);
  spawnP(player.x+player.w/2,player.y+player.h/2,14,'#ff8aa6',200,.7);
  if(hearts<=0){ hearts=0; showCard('over'); return; }
  if(doRespawn) softRespawn(); else { player.iframe=IFRAME; player.vy=-340; player.vx=-player.face*260; } }
function levelComplete(){ save.furthest=Math.max(save.furthest||0,cur+1); writeSave();
  if(cur+1<LEVELS.length) showCard('next'); else showCard('win'); }

/* --- 4j Ana güncelleme hattı (sıra v1 ile birebir) --- */
function update(dt){ t+=dt; pulse+=dt;
  if(flash>0)flash=Math.max(0,flash-dt); if(hintT>0)hintT-=dt; if(heartFlash>0)heartFlash-=dt;
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeMag=0; }
  updateAmbient(dt, state==="play"?cam:0);
  if(state!=='play') return;
  let dir=(input.right?1:0)-(input.left?1:0);
  if(dir!==0){ player.vx+=dir*ACCEL*dt; player.face=dir; } else { const s=Math.sign(player.vx); player.vx-=s*FRICTION*dt; if(Math.sign(player.vx)!==s)player.vx=0; }
  player.vx=Math.max(-MOVE,Math.min(MOVE,player.vx));
  if(input.jumpEdge){ player.jbuf=JBUF; input.jumpEdge=false; } else player.jbuf=Math.max(0,player.jbuf-dt);
  player.coyote=player.grounded?COYOTE:Math.max(0,player.coyote-dt);
  if(player.jbuf>0&&player.coyote>0){ player.vy=-JUMP_V; player.grounded=false; player.coyote=0; player.jbuf=0; player.squash=1.3; player.squashVel=0; sfx('jump'); spawnP(player.x+player.w/2,player.y+player.h,6,'#eafff2',120,.4); }
  if(!input.jumpHeld&&player.vy<-JUMP_CUT) player.vy=-JUMP_CUT;
  player.vy=Math.min(MAX_FALL,player.vy+GRAV*dt);
  equipped=computeEquip();
  const bp=document.getElementById('bPow'); if(equipped){ const e=tool(equipped); bp.style.background=e.col; bp.textContent=e.emoji; } else { bp.style.background='rgba(255,247,236,.78)'; bp.textContent='✨'; }
  if(input.useEdge){ doUse(); input.useEdge=false; }
  if(input.sandEdge){ throwSand(); input.sandEdge=false; }
  player.x+=player.vx*dt;
  for(const s of solids()){ if(overlap(player,s)){ if(player.vx>0)player.x=s.x-player.w; else if(player.vx<0)player.x=s.x+s.w; player.vx=0; } }
  player.x=Math.max(0,Math.min(L.w-player.w,player.x));
  const wasG=player.grounded; player.grounded=false; player.y+=player.vy*dt;
  for(const s of solids()){ if(overlap(player,s)){ if(player.vy>0){ player.y=s.y-player.h;
      if(s.bounce){ player.vy=-BOUNCE; player.squash=1.4; player.squashVel=0; sfx('boing'); screenShake(3,.12); spawnP(player.x+player.w/2,player.y+player.h,8,'#d9b0f0',170,.5); }
      else { player.grounded=true; if(!wasG&&player.vy>300){ const fall=Math.min(1,player.vy/MAX_FALL); player.squash=.72-fall*.1; player.squashVel=0; beep(190-fall*70,.09,'triangle',.22,140); noise(.08,.1+fall*.08,400); screenShake(1+fall*4,.08+fall*.08); spawnP(player.x+player.w/2,player.y+player.h,5+Math.round(fall*4),'#eafff2',100+fall*60,.35); } player.vy=0; } }
    else if(player.vy<0){ player.y=s.y+s.h; player.vy=0; } } }
  { const SPK=CONFIG.juice.squashK, SPD=CONFIG.juice.squashDamp; player.squashVel+=(1-player.squash)*SPK*dt; player.squashVel*=Math.max(0,1-SPD*dt); player.squash+=player.squashVel*dt; }
  if(Math.abs(player.vy)>CONFIG.juice.trailVy&&Math.random()<CONFIG.juice.trailChance){ particles.push({x:player.x+player.w/2+(Math.random()*8-4),y:player.y+player.h*.35,vx:-player.vx*.12,vy:-player.vy*.08,life:.22,max:.22,col:'rgba(190,240,255,.5)',r:2.5+Math.random()*2}); }
  const pcx=player.x+player.w/2, pFeet=player.y+player.h;
  findHealTarget(pcx,pFeet); findNearTree(pcx,pFeet);
  for(const m of L.monsters) updateMonster(m,dt,pcx,pFeet);
  updateSands(dt); updateBoss(dt,pcx);
  for(const cp of L.checkpoints){ if(pcx>cp.x&&respawn.x<cp.x){ respawn={x:cp.x,y:cp.y-player.h-2}; spawnP(cp.x,cp.y-30,12,'#9fe6c4',120,.7); if(sandLeft<sandMax){ sandLeft=sandMax; updateSandBadge(); } } }
  if(player.y>L.deathY){ if(L.gentle) softRespawn(); else loseLife(true); }
  if(L.goal){ const dx=pcx-L.goal.x, dy=(player.y+player.h/2)-L.goal.y; if(Math.hypot(dx,dy)<L.goal.r+18){ sfx('clear'); levelComplete(); } }
  if(player.iframe>0)player.iframe-=dt;
  player.blinkT-=dt; if(player.blinkT<=0){player.blink=.12;player.blinkT=1.8+Math.random()*2.6;} if(player.blink>0)player.blink-=dt;
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; if(p.life<=0){particles.splice(i,1);continue;} p.vy+=380*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  const target=Math.max(0,Math.min(L.w-W,pcx-W/2)); cam+=(target-cam)*Math.min(1,dt*CONFIG.camera.lerp); }

   Bir "tarif" nesnesinden eksiksiz, oynanabilir bir bölüm üretir. Kanıtlanmış
   B1 platform genişlikleri + sabit GAP (MOVE/JUMP_V ile her zaman adil geçilebilir

   (ağaç+kontrol noktası) ve bulmaca platformları ayrı tutulur; aralarında GAP
   payı bırakıldığından ağaç ile bulmaca ASLA çakışmaz (konum bazında sonradan
   kontrol etmeye gerek yok — tasarımla garanti). Yeni bölüm eklemek artık

const SECTION_RHYTHM=[ {w:380,h:240},{w:300,h:240},{w:460,h:240},{w:220,h:245},{w:240,h:248},{w:260,h:252} ];

function makeSection(recipe){
  const { name, biome, treeIds, tier=1, puzzleTypes, cageEye, finisher, hint } = recipe;
  const pairCount=Math.max(treeIds.length,puzzleTypes.length,3); /* kural: en az 3 ağaç/bulmaca çifti */
  const segCount=pairCount*2+2; /* her ağaç için [sakin+bulmaca] + son 2 boss alanı */
  const platforms=[]; let x=20;
  for(let i=0;i<segCount;i++){ const r=SECTION_RHYTHM[i%SECTION_RHYTHM.length], y=370-((Math.floor(i/2)%3)*6);
    platforms.push({x,y,w:r.w,h:r.h}); x+=r.w+GAP+Math.min(30,tier*6); }
  const w=x+420;
  const calmP=[], puzzleP=[];
  for(let i=0;i<segCount-2;i++) (i%2===0?calmP:puzzleP).push(platforms[i]);
  const checkpoints=[], trees=[];
  treeIds.forEach((tid,i)=>{ const p=calmP[Math.min(i,calmP.length-1)];
    checkpoints.push({x:p.x+22,y:p.y}); trees.push({id:tid,x:p.x+p.w-46,y:p.y}); });
  const interact=puzzleP.map((p,i)=>PUZZLE_FACTORY[puzzleTypes[i%puzzleTypes.length]](p.x+p.w*.22,p.y));
  const monsters=puzzleP.map((p,i)=>{ const gx0=p.x+16, gx1=p.x+p.w-16;
    return {x:(gx0+gx1)/2, gx0, gx1, ground:p.y, lo:gx0-30, hi:gx1+30,
      spd:82+tier*10, aggro:165+tier*12, patrolSpd:34+tier*3, flip:(i%3===2)}; });
  const lastCalm=platforms[segCount-2], lastPlat=platforms[segCount-1];
  const boss={x:lastPlat.x+lastPlat.w*.35,w:88,h:88,ground:lastPlat.y,hp:3,state:'sleep',face:-1,atkT:1.8,tel:0,blindT:0,cageT:0,defT:0,paceDir:-1,
    px0:lastPlat.x+40,px1:lastPlat.x+lastPlat.w-120,shake:0,cageEye,finisher,scale:1};
  const arena={trig:lastCalm.x+30, wall:{x:lastCalm.x-8,y:120,w:14,h:500}};
  return { name, w, deathY:760, gentle:false, spawn:{x:90,y:300}, platforms, water:null,
    interact, monsters, boss, arena, checkpoints, goal:null, hasSand:true, hasHeal:true, trees,
    intros:[{x:60,text:hint||'Yeni bir bölge — ağaçları bul, bulmacaları çöz!'}] };
}

function drawBarkSwatch(c,x,y,w,h,species){

    const pal=['#8a9a5b','#a9895c','#e8dcc0','#8a9a5b','#c9b98a']; let seed=7;
    for(let i=0;i<9;i++){ seed=(seed*9301+49297)%233280; const rx=x+(seed/233280)*w;
      seed=(seed*9301+49297)%233280; const ry=y+(seed/233280)*h;

  else if(species==='huş'){ c.fillStyle='#e8e2d4'; c.fillRect(x,y,w,h); c.strokeStyle='#3a352c'; c.lineWidth=1.4;

      seed=(seed*9301+49297)%233280; const rx=x+(seed/233280)*w*.8; const rw=4+((seed>>3)%6);
      c.beginPath(); c.moveTo(rx,ry); c.lineTo(rx+rw,ry+1); c.stroke(); } }
  else if(species==='çam'||species==='servi'){ c.fillStyle='#6b4a35'; c.fillRect(x,y,w,h); c.strokeStyle='#48301f'; c.lineWidth=1.2;
    for(let i=2;i<w;i+=4){ c.beginPath(); const jx=x+i+Math.sin(i*.9)*1; c.moveTo(jx,y); c.lineTo(jx+1,y+h); c.stroke(); } }
  else if(species==='kayın'){ c.fillStyle='#9a9184'; c.fillRect(x,y,w,h); c.strokeStyle='#7d7568'; c.lineWidth=1;
    for(let i=4;i<w;i+=10){ c.beginPath(); c.moveTo(x+i,y+2); c.lineTo(x+i,y+h-2); c.stroke(); } }
  else { c.fillStyle='#8a8478'; c.fillRect(x,y,w,h); c.strokeStyle='#6f6a5f'; c.lineWidth=1;

/* İllüstrasyon kalitesi: gradyan dolgu + orta damar + yan damarlar + sap.
   withBark=true (varsayılan) altta tür-özel kabuk şeridi de çizer. */
function getTreeIcon(species,size,withBark){ if(withBark===undefined) withBark=true;
  const key=species+':'+size+':'+withBark; if(treeIconCache[key]) return treeIconCache[key];
  const cv=document.createElement('canvas'); cv.width=size; cv.height=Math.round(withBark?size*1.32:size*1.08); const c=cv.getContext('2d');
  const cx=size/2, cy=size*.46, s=size*.86, pathFn=LEAF_PATH[species]||LEAF_PATH['meşe'];
  const cols=LEAF_COLOR[species]||LEAF_COLOR['meşe'];
  /* sap */
  c.strokeStyle='#6b5a3a'; c.lineWidth=Math.max(1.6,size*.03); c.lineCap='round';
  c.beginPath(); c.moveTo(cx,cy+.42*s); c.quadraticCurveTo(cx+.03*s,cy+.5*s,cx-.02*s,cy+.56*s); c.stroke();
  /* gövde: gradyan dolgu */
  pathFn(c,cx,cy,s);
  const lg=c.createLinearGradient(cx-.4*s,cy-.4*s,cx+.4*s,cy+.4*s); lg.addColorStop(0,cols[0]); lg.addColorStop(1,cols[1]);
  c.fillStyle=lg; c.fill();
  c.strokeStyle='rgba(20,50,35,.45)'; c.lineWidth=Math.max(1.1,size*.018); c.stroke();
  /* damar sistemi: orta + yan damarlar (kırpılmış) */
  c.save(); pathFn(c,cx,cy,s); c.clip();
  c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=Math.max(1,size*.016); c.lineCap='round';
  c.beginPath(); c.moveTo(cx,cy-.42*s); c.lineTo(cx,cy+.42*s); c.stroke();
  c.lineWidth=Math.max(.8,size*.011);
  for(let i=0;i<4;i++){ const vy=cy-.30*s+i*.19*s;
    c.beginPath(); c.moveTo(cx,vy); c.quadraticCurveTo(cx+.16*s,vy+.02*s,cx+.30*s,vy-.07*s); c.stroke();
    c.beginPath(); c.moveTo(cx,vy); c.quadraticCurveTo(cx-.16*s,vy+.02*s,cx-.30*s,vy-.07*s); c.stroke(); }
  c.restore();
  if(withBark) drawBarkSwatch(c,size*.14,size*1.12,size*.72,size*.14,species);
  const url=cv.toDataURL(); treeIconCache[key]=url; return url; }

    ctx.fillStyle='rgba(232,194,122,.5)'; ctx.beginPath(); ctx.arc(cx,by+34,b.w*.45,0,7); ctx.fill();
    ctx.fillStyle='#fff1b8'; for(let k=0;k<4;k++){ const a=t*4+k*1.6; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*26,by+14+Math.sin(a)*6,2.5,0,7); ctx.fill(); } }
  else if(defeated){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx-16,by+30,9,0,7); ctx.arc(cx+16,by+30,9,0,7); ctx.fill();
    ctx.fillStyle='#3a2a4a'; ctx.beginPath(); ctx.arc(cx-16,by+32,3.5,0,7); ctx.arc(cx+16,by+32,3.5,0,7); ctx.fill();
    ctx.strokeStyle='#2e1f40'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,by+52,8,1.15*Math.PI,1.85*Math.PI); ctx.stroke();
    ctx.fillStyle='#7fd3e8'; for(const ex of [-16,16]){ ctx.beginPath(); ctx.ellipse(cx+ex,by+42+(t*30%18),3,5,0,0,7); ctx.fill(); } }
  else { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx-16,by+30,10,0,7); ctx.arc(cx+16,by+30,10,0,7); ctx.fill(); const look=b.face*2;
    ctx.fillStyle='#2e1f40'; ctx.beginPath(); ctx.arc(cx-16+look,by+32,4,0,7); ctx.arc(cx+16+look,by+32,4,0,7); ctx.fill();
    ctx.strokeStyle='#2e1f40'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(cx-26,by+18); ctx.lineTo(cx-8,by+24); ctx.moveTo(cx+26,by+18); ctx.lineTo(cx+8,by+24); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,by+54,9,1.15*Math.PI,1.85*Math.PI); ctx.stroke(); }
  ctx.restore();
  if(b.state==='caged'&&b.finisher!=='shrink'){ const a=Math.min(1,(C.cageT0-b.cageT)/.4); ctx.save(); ctx.globalAlpha=.95; ctx.strokeStyle='#3f8c52'; ctx.lineWidth=5; ctx.lineCap='round';
    for(let i=0;i<=4;i++){ const lx=bx-6+i*(b.w+12)/4; ctx.beginPath(); for(let yy=by-18;yy<=Math.min(b.ground,by-18+(b.h+18)*a);yy+=10){ const wob=Math.sin(yy*.2+i)*3*a; (yy===by-18?ctx.moveTo:ctx.lineTo).call(ctx,lx+wob,yy); } ctx.stroke(); }
    ctx.fillStyle='#5fc77f'; for(let i=0;i<6;i++){ const lx=bx+8+i*12, ly=by-10+i*12*a; ctx.beginPath(); ctx.ellipse(lx,ly,6,3,i,0,7); ctx.fill(); } ctx.restore(); }
  if(b.state==='caged'&&b.finisher==='shrink'){ ctx.save(); ctx.strokeStyle='#b07ad8'; ctx.lineWidth=4; ctx.globalAlpha=.8; const rr=44*(b.cageT/C.cageT0)+10;
    ctx.beginPath(); ctx.arc(bx+b.w/2,by+b.h/2,rr,0,7); ctx.stroke(); ctx.globalAlpha=.5;
    for(let k=0;k<5;k++){ const a=t*5+k*1.3; ctx.beginPath(); ctx.arc(bx+b.w/2+Math.cos(a)*rr,by+b.h/2+Math.sin(a)*rr,2.5,0,7); ctx.fillStyle='#d9b0f0'; ctx.fill(); } ctx.restore(); }
  for(let i=0;i<3;i++){ const hx=cx-30+i*30, hy=by-30, full=i<b.hp; ctx.save(); ctx.translate(hx,hy); ctx.scale(.8,.8);
    ctx.fillStyle=full?'#6b4a8a':'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.moveTo(0,8); ctx.bezierCurveTo(-15,-7,-7,-17,0,-8); ctx.bezierCurveTo(7,-17,15,-7,0,8); ctx.fill();
    if(full){ ctx.strokeStyle='#3a2a4a'; ctx.lineWidth=1.4; ctx.stroke(); } ctx.restore(); } }
function drawBossShots(){ for(const s of bossShots){ const x=s.x-cam,y=s.y; ctx.fillStyle='#ffb27a'; ctx.beginPath(); ctx.arc(x,y,11,0,7); ctx.fill();
  ctx.fillStyle='#8c95a0'; ctx.beginPath(); ctx.arc(x-3,y-9,5,0,7); ctx.arc(x+4,y-9,5,0,7); ctx.fill();
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(x-3,y,1.6,0,7); ctx.arc(x+3,y,1.6,0,7); ctx.fill(); } }

function drawPlayer(){ const x=player.x-cam+player.w/2,y=player.y+player.h; if(player.iframe>0&&Math.floor(t*16)%2===0) return;
  const sq=player.squash,st=2-sq,bw=player.w*.95*sq,bh=player.h*1.02*st; const ec=equipped?tool(equipped).col:'#9fe6d6';
  ctx.save(); ctx.translate(x,y-bh/2);
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,bh/2+4,bw*.5,6,0,0,7); ctx.fill();
  ctx.strokeStyle=ec; ctx.globalAlpha=.5+Math.sin(t*4)*.2; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0,0,bw/2+4,bh/2+4,0,0,7); ctx.stroke(); ctx.globalAlpha=1;
  const fw=Math.sin(t*12)*(Math.abs(player.vx)>30?3:0); ctx.fillStyle='#2f9e8f'; ctx.beginPath(); ctx.ellipse(-9,bh/2-2+fw,9,6,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(9,bh/2-2-fw,9,6,0,0,7); ctx.fill();
  const bg=ctx.createLinearGradient(0,-bh/2,0,bh/2); bg.addColorStop(0,'#5fe3c9'); bg.addColorStop(1,'#34bfa6'); ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,bw/2,bh/2,0,0,7); ctx.fill();
  const healing=input.healHeld; ctx.fillStyle=healing?'#ffd54a':'rgba(255,255,255,.35)'; if(healing){ ctx.shadowColor='rgba(255,213,74,.9)'; ctx.shadowBlur=10; }
  ctx.beginPath(); ctx.moveTo(0,8); ctx.bezierCurveTo(-12,-4,-6,-12,0,-5); ctx.bezierCurveTo(6,-12,12,-4,0,8); ctx.fill(); ctx.shadowBlur=0;
  const eyes=[[-13,-6],[-6.5,-11],[0,-13],[6.5,-11],[13,-6]], look=Math.max(-1.4,Math.min(1.4,player.vx/MOVE*1.4));
  for(let i=0;i<5;i++){ const ex=eyes[i][0], ey=eyes[i][1]; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,4.4,0,7); ctx.fill();
    if(i===2&&equipped){ ctx.strokeStyle=ec; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(ex,ey,5.7,0,7); ctx.stroke(); }
    if(player.blink>0){ ctx.strokeStyle='#1f6b60'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(ex-3,ey); ctx.lineTo(ex+3,ey); ctx.stroke(); }
    else { ctx.fillStyle=(i===2&&equipped)?ec:'#1f4d4a'; ctx.beginPath(); ctx.arc(ex+look,ey,2.1,0,7); ctx.fill(); } }
  ctx.strokeStyle='#1f6b60'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,1,5,.15*Math.PI,.85*Math.PI); ctx.stroke(); ctx.restore(); }

function drawParticles(){ for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x-cam,p.y,p.r,0,7); ctx.fill(); } ctx.globalAlpha=1; }

function drawAmbient(camX){ const shape=BIOME[ambientBiome()].ambientShape;
  for(const l of ambient){ ctx.save(); ctx.translate(l.x-camX,l.y);
    if(shape==='wisp'){ ctx.globalAlpha=.22; ctx.fillStyle=l.c; ctx.beginPath(); ctx.ellipse(0,0,l.s,l.s*.32,0,0,7); ctx.fill(); }
    else if(shape==='mote'){ ctx.globalAlpha=.55+Math.sin(t*3+l.ph)*.25; ctx.fillStyle=l.c; ctx.shadowColor=l.c; ctx.shadowBlur=6; ctx.beginPath(); ctx.arc(0,0,l.s,0,7); ctx.fill(); }
    else { ctx.rotate(l.rot+Math.sin(t*l.sw+l.ph)*.5); ctx.globalAlpha=.72; ctx.fillStyle=l.c; ctx.beginPath(); ctx.ellipse(0,0,l.s,l.s*.45,0,0,7); ctx.fill(); }
    ctx.restore(); } ctx.globalAlpha=1; ctx.shadowBlur=0; }

/* Karanlık sistemi — Bölüm 3 (aşama 2) için hazır; L.dark yoksa hiç çalışmaz */
function drawDarkness(){ if(!L.dark) return; dctx.clearRect(0,0,W,H); dctx.fillStyle='rgba(10,8,26,0.9)'; dctx.fillRect(0,0,W,H); dctx.globalCompositeOperation='destination-out';
  const punch=(sx,sy,r)=>{ const g=dctx.createRadialGradient(sx,sy,0,sx,sy,r); g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.6,'rgba(0,0,0,.85)'); g.addColorStop(1,'rgba(0,0,0,0)'); dctx.fillStyle=g; dctx.beginPath(); dctx.arc(sx,sy,r,0,7); dctx.fill(); };
  punch(player.x-cam+player.w/2, player.y+player.h/2, 150+(equipped==='red'?70:0));
  for(const it of L.interact){ if(it.type==='torch'&&it.done) punch(it.x-cam,it.y-30,190); }
  dctx.globalCompositeOperation='source-over'; ctx.drawImage(darkCv,0,0); }

function drawHUD(){ for(let i=0;i<3;i++){ const x=24+i*38,y=58,filled=i<hearts,pp=(filled&&heartFlash>0)?1+heartFlash*.5:1;
    ctx.save(); ctx.translate(x,y); ctx.scale(pp,pp); ctx.shadowColor='rgba(0,0,0,.2)'; ctx.shadowBlur=4;
    ctx.fillStyle=filled?'#ff5d86':'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(0,8); ctx.bezierCurveTo(-15,-7,-7,-17,0,-8); ctx.bezierCurveTo(7,-17,15,-7,0,8); ctx.fill(); ctx.restore(); }
  ctx.fillStyle='rgba(255,247,236,.92)'; rrect(W-238,72,160,30,12); ctx.fill();
  ctx.fillStyle='#1f4d4a'; ctx.font='bold 13px Trebuchet MS'; ctx.textAlign='center';
  ctx.fillText((bossActive&&L.boss&&L.boss.state!=='defeated')?S('boss.title'):L.name,W-158,91);
  let msg=hintMsg, alpha=hintT>0?Math.min(1,hintT*2):0;
  if(L.intros&&L.intros.length){ for(const it of L.intros){ if(Math.abs((player.x+player.w/2)-it.x)<130){ msg=it.text; alpha=1; break; } } }
  if(nearTree){ msg=S('tree.prompt'); alpha=1; }
  if(msg&&alpha>0){ ctx.fillStyle='rgba(255,247,236,'+alpha+')'; ctx.font='bold 17px Trebuchet MS'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(20,30,30,'+(alpha*.8)+')'; ctx.lineWidth=4; ctx.strokeText(msg,W/2,H-94); ctx.fillText(msg,W/2,H-94); } }

function drawMenuMonster(cx,groundY){ const bob=Math.sin(t*2)*5, y=groundY-32+bob, bw=72,bh=80; ctx.save(); ctx.translate(cx,y);
  ctx.fillStyle='rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(0,(groundY-y)+2,36,7,0,0,7); ctx.fill();
  ctx.fillStyle='#2f9e8f'; ctx.beginPath(); ctx.ellipse(-16,bh/2-4,14,9,0,0,7); ctx.ellipse(16,bh/2-4,14,9,0,0,7); ctx.fill();
  const bg=ctx.createLinearGradient(0,-bh/2,0,bh/2); bg.addColorStop(0,'#5fe3c9'); bg.addColorStop(1,'#34bfa6'); ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,0,bw/2,bh/2,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(0,14); ctx.bezierCurveTo(-20,-6,-10,-20,0,-8); ctx.bezierCurveTo(10,-20,20,-6,0,14); ctx.fill();
  const blink=(Math.sin(t*1.7)>.96)?1:0, eyes=[[-22,-10],[-11,-19],[0,-22],[11,-19],[22,-10]];
  for(let i=0;i<5;i++){ const ex=eyes[i][0], ey=eyes[i][1]; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,7.5,0,7); ctx.fill();
    if(blink){ ctx.strokeStyle='#1f6b60'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ex-5,ey); ctx.lineTo(ex+5,ey); ctx.stroke(); }
    else { ctx.fillStyle='#1f4d4a'; ctx.beginPath(); ctx.arc(ex,ey,3.4,0,7); ctx.fill(); } }
  ctx.strokeStyle='#1f6b60'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(0,2,9,.15*Math.PI,.85*Math.PI); ctx.stroke(); ctx.restore(); }

function drawMenuScene(){ cam=0; drawMeadowBg(t*12);
  drawIsland({x:W/2-250,y:392,w:200,h:170}); drawIsland({x:W/2+70,y:418,w:210,h:150});
  drawMenuMonster(W/2-150,392); drawAmbient(0); ctx.drawImage(vig,0,0);
  ctx.textAlign='center'; ctx.fillStyle='#1f4d4a'; ctx.font='bold 46px Trebuchet MS';
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowOffsetY=4; ctx.fillText(S('menu.title'),W/2,150); ctx.restore();
  ctx.fillStyle='#37635f'; ctx.font='bold 19px Trebuchet MS'; ctx.fillText(S('menu.subtitle'),W/2,184);
  if(save.furthest>0){ const nxt=Math.min(save.furthest,LEVELS.length-1), meta=LEVEL_META[nxt];
    const msg=save.furthest>=LEVELS.length ? 'Tüm bölümler tamamlandı ✓' : ('İlerleme kaydedildi — '+S(WORLD[meta.regionIdx].nameKey)+' seni bekliyor');
    ctx.fillStyle='#2f9e8f'; ctx.font='bold 15px Trebuchet MS'; ctx.fillText(msg,W/2,210); } }

function render(){ if(state==='menu'){ drawMenuScene(); return; }
  ctx.save();
  if(shakeT>0){ const amt=shakeMag*(shakeT/Math.max(shakeDur,.001)); ctx.translate((Math.random()*2-1)*amt,(Math.random()*2-1)*amt); }
  (BG_FNS[L.biome]||drawMeadowBg)(cam);
  drawWater(); for(const s of L.platforms) drawIsland(s); drawInteract();
  if(L.trees) for(const tr of L.trees) drawTreeSprite(tr);
  for(const cp of L.checkpoints) drawCP(cp); if(L.goal) drawGoal(L.goal);
  for(const m of L.monsters) drawMonster(m); if(healTarget) drawHealBeam(healTarget);
  drawSands(); drawBoss(); drawBossShots(); drawParticles(); drawPlayer(); drawAmbient(cam); drawDarkness();
  ctx.drawImage(vig,0,0); drawHUD();
  if(flash>0){ ctx.fillStyle='rgba('+flashCol+','+(flash*.5)+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore(); }

/* ============================== 7) UI ============================== */
const ov=document.getElementById('ov'), card=document.getElementById('card');
function setUI(mode){ const playing=mode==='play';
  document.getElementById('padL').style.display=playing?'flex':'none';
  document.getElementById('padR').style.display=playing?'grid':'none';
  document.getElementById('restart').style.display=playing?'block':'none';
  document.getElementById('pauseBtn').style.display=playing?'block':'none';
  document.getElementById('menu').style.display=(mode==='menu')?'flex':'none';
  document.getElementById('langRow').style.display=(mode==='menu')?'flex':'none';
  if(mode==='menu') document.getElementById('continueBtn').style.display=(save.furthest>0)?'block':'none'; }
function updateActionButtons(){ document.getElementById('bSand').style.display=L.hasSand?'flex':'none'; document.getElementById('bHeal').style.display=L.hasHeal?'flex':'none'; }

function loadLevel(i){ cur=i; L=prepLevel(LEVELS[i](),i);
  hearts=CONFIG.hearts; respawn={x:L.spawn.x,y:L.spawn.y};
  player.x=L.spawn.x; player.y=L.spawn.y; player.vx=0; player.vy=0; player.iframe=0; player.squash=1; player.squashVel=0; player.face=1;
  sands.length=0; particles.length=0; healTarget=null; equipped=null; cam=0; resetAmbient(0);
  bossActive=false; bossShots.length=0;
  hintMsg=''; hintT=0; shakeT=0; shakeMag=0; hitStopT=0; clearEdges();
  refillSand(); save.furthest=Math.max(save.furthest||0,i); writeSave();
  state='play'; ov.classList.add('hidden'); updateActionButtons(); setUI('play'); }

function togglePause(){ if(state==='play') showCard('pause'); else if(state==='pause') resumeGame(); }
function resumeGame(){ ov.classList.add('hidden'); state='play'; setUI('play'); clearEdges(); }
function toMenu(){ state='menu'; cam=0; ov.classList.add('hidden'); setUI('menu'); clearEdges(); }

function howtoHTML(){ return '<div class="eyes">👁️👁️👁️👁️👁️</div><h1>'+S('howto.title')+'</h1><p>'+S('howto.body')+'<br>'+S('howto.tools')+'</p>'
 +'<p>'+S('howto.heal')+'</p><div class="hint">'+S('howto.controls')+'</div><div class="row" style="margin-top:14px"><button class="ghost" id="backBtn">'+S('ui.back')+'</button></div>'; }

/* Harita/Bölümler: bölgeye göre gruplanmış düğüm-yol görünümü. Kilit mantığı
   tek kural — bir bölüm ancak öncekini tamamlayınca açılır (save.furthest).
   Her bölge başlığında biyomunu yansıtan küçük bir renk/simge rozeti var. */
const BIOME_ICON={meadow:'🌿',peaks:'⛰️',cave:'💎'};
function buildMapHTML(){ const furthest=save.furthest||0; let html='<h1>'+S('map.title')+'</h1>';
  let flat=0;
  WORLD.forEach((region,ri)=>{ const B=BIOME[region.biome];
    html+='<div class="mapRegion"><h2><span class="mapIcon" style="background:'+B.skyMid+'">'+(BIOME_ICON[region.biome]||'')+'</span>'+S(region.nameKey)+'</h2><div class="mapPath">';
    region.levels.forEach((_,li)=>{ const idx=flat, unlocked=idx<=furthest, done=idx<furthest, isNext=idx===furthest;
      if(li>0) html+='<div class="mapLine'+(done?' done':'')+'"></div>';
      const cls=!unlocked?'locked':(done?'done':(isNext?'next':''));
      html+='<button class="mapNode '+cls+'" data-lv="'+idx+'" '+(unlocked?'':'disabled')+'>'+(done?'✓':(idx+1))+'</button>';
      flat++; }); html+='</div></div>'; });
  html+='<div class="row" style="margin-top:12px"><button class="ghost" id="backBtn">'+S('ui.back')+'</button></div>';
  return html; }

/* Doğa Günlüğü: yalnız uyandırılan ağaçları listeler — hearts sisteminden
   ayrı, cezasız bir koleksiyon. */
function journalHTML(){ const learned=save.journal||[]; let html='<h1>'+S('journal.title')+'</h1>';
  if(!learned.length){ html+='<p class="hint">'+S('journal.empty')+'</p>'; }
  else { html+='<div class="col" style="margin-top:8px">'+learned.map(id=>{ const info=TREES[id]||{family:'',gift:''}, nm=treeName(id);
      return '<div style="border-radius:16px;padding:10px 16px;background:#f3ead9;text-align:left;width:100%;display:flex;gap:12px;align-items:center">'
        +'<img src="'+getTreeArt(id,60,true)+'" alt="" style="width:46px;height:auto;flex:none">'
        +'<div style="flex:1"><b>'+nm+'</b><br><span class="hint">'+S('journal.family')+info.family+'<br>'+S('journal.gift')+info.gift+'</span></div>'
        +'<span class="sayBtn" data-say="'+nm+'" role="button" aria-label="dinle">🔊</span></div>'; }).join('')+'</div>'; }
  html+='<div class="row" style="margin-top:12px"><button class="ghost" id="backBtn">'+S('ui.back')+'</button></div>';
  return html; }

function showCard(kind){ state=kind;
  if(kind==='next'){ sfx('clear'); card.innerHTML='<div class="eyes">'+S('next.eyes')+'</div><h1>'+L.name+S('next.suffix')+'</h1><p>'+S('next.body')+'</p><div class="row"><button class="play" id="nextBtn">'+S('ui.nextLevel')+'</button><button class="ghost" id="menuBtn">'+S('ui.menu')+'</button></div>'; }
  else if(kind==='win'){ sfx('win'); card.innerHTML='<div class="eyes">'+S('win.eyes')+'</div><h1>'+S('win.title')+'</h1><p>'+S('win.body')+'</p><div class="row"><button class="play" id="againBtn">'+S('ui.playAgain')+'</button><button class="ghost" id="menuBtn">'+S('ui.menu')+'</button></div>'; }
  else if(kind==='over'){ sfx('sad'); card.innerHTML='<div class="eyes">'+S('over.eyes')+'</div><h1>'+S('over.title')+'</h1><p>'+S('over.body')+'</p><div class="row"><button class="play" id="retryBtn">'+S('ui.retry')+'</button><button class="ghost" id="menuBtn">'+S('ui.menu')+'</button></div>'; }
  else if(kind==='pause'){ card.innerHTML='<div class="eyes">⏸</div><h1>'+S('pause.title')+'</h1><p>'+S('pause.body')+'</p><div class="row"><button class="play" id="resumeBtn">'+S('ui.resume')+'</button><button class="ghost" id="retryBtn">'+S('ui.restart')+'</button><button class="ghost" id="menuBtn">'+S('ui.menu')+'</button></div>'; }
  else if(kind==='levels'){ card.innerHTML=buildMapHTML(); }
  else if(kind==='journal'){ card.innerHTML=journalHTML(); }
  else { card.innerHTML=howtoHTML(); }
  ov.classList.remove('hidden'); setUI(kind);
  const q=id=>document.getElementById(id);
  if(q('backBtn')) q('backBtn').onclick=toMenu;
  if(q('nextBtn')) q('nextBtn').onclick=()=>loadLevel(cur+1);
  if(q('againBtn')) q('againBtn').onclick=()=>loadLevel(0);
  if(q('retryBtn')) q('retryBtn').onclick=()=>loadLevel(cur);
  if(q('menuBtn')) q('menuBtn').onclick=toMenu;
  if(q('resumeBtn')) q('resumeBtn').onclick=resumeGame;
  wireSayButtons(card);
  card.querySelectorAll('.mapNode:not(.locked)').forEach(btn=>{ btn.onclick=()=>{ initAudio(); requestFS(); loadLevel(parseInt(btn.dataset.lv,10)); }; }); }

/* --- Dil seçimi: menüdeki metinleri yeniden çizer; tr dışı tablolar boşsa
   otomatik tr'ye düşer (fallback), böylece hiçbir metin boş kalmaz. --- */
function refreshStaticUI(){
  document.getElementById('startBtn').textContent=S('ui.newGame');
  document.getElementById('continueBtn').textContent=S('ui.continue');
  document.getElementById('levelsBtn').textContent=S('ui.levels');
  document.getElementById('journalBtn').textContent=S('ui.journal');
  document.getElementById('howBtn').textContent=S('ui.howto');
  document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
  if(state!=='play'&&state!=='tree') { /* kartlar açıksa yeniden çiz */ if(!ov.classList.contains('hidden')) showCard(state); } }
function setLang(l){ lang=l; save.lang=l; writeSave(); document.documentElement.setAttribute('lang',l); document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr'); refreshStaticUI(); }
document.querySelectorAll('.langBtn').forEach(b=> b.addEventListener('click',()=>setLang(b.dataset.l)) );
setLang(save.lang||'tr');

document.getElementById('startBtn').addEventListener('click',()=>{ initAudio(); requestFS(); loadLevel(0); });
document.getElementById('continueBtn').addEventListener('click',()=>{ initAudio(); requestFS(); loadLevel(Math.min(save.furthest||0,LEVELS.length-1)); });
document.getElementById('levelsBtn').addEventListener('click',()=>{ initAudio(); showCard('levels'); });
document.getElementById('journalBtn').addEventListener('click',()=>{ initAudio(); showCard('journal'); });
document.getElementById('howBtn').addEventListener('click',()=>{ initAudio(); showCard('howto'); });
document.getElementById('fsBtn').addEventListener('click',toggleFS); syncFsIcon();
document.getElementById('restart').addEventListener('click',()=>loadLevel(cur));
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('mute').addEventListener('click',()=>{ initAudio(); toggleMute(); });
document.getElementById('mute').textContent=muted?'🔇':'🔊';
setUI('menu'); resetAmbient(0);

/* ============================= 8) BOOT ============================= */
let last=performance.now();
function loop(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,1/30);
  if(hitStopT>0){ hitStopT-=dt; render(); requestAnimationFrame(loop); return; }
  update(dt); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
